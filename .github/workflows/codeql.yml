name: "CodeQL Advanced Debugging"

on:
  push:
    branches: [ "ver-0(un-useable)" ]
  pull_request:
    branches: [ "ver-0(un-useable)" ]
  schedule:
    - cron: '44 15 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: autobuild
        - language: python
          build-mode: autobuild
        - language: java-kotlin
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: autobuild
        - language: go
          build-mode: autobuild
        - language: ruby
          build-mode: autobuild
        - language: swift
          build-mode: autobuild
        - language: sql
          build-mode: manual
        - language: asm
          build-mode: manual
        - language: unknown
          build-mode: skip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Detect File Extensions in All Folders
      run: |
        echo -e "\033[1;36m🔍 Scanning files (including hidden folders)...\033[0m"
        
        # Recursively find all files including hidden ones
        find . -type f 2>/dev/null | while read file; do
          ext="${file##*.}"
          size=$(wc -c < "$file")
          
          # Check if the file is empty
          if [[ "$size" -eq 0 ]]; then
            echo -e "\033[1;33m⚠️ Skipping empty file: $file\033[0m"
            continue
          fi

          # Check if the extension is supported
          case "$ext" in
            c|cpp|h|py|java|kt|js|ts|go|rb|swift|sql|asm) 
              echo -e "\033[1;32m✅ Detected supported file: $file\033[0m" ;;
            *)
              echo -e "\033[1;33m⚠️ Warning: Unknown file extension '$ext' in file '$file'\033[0m" ;;
          esac
        done

    - name: Initialize CodeQL
      if: matrix.build-mode != 'skip'
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run CodeQL Analysis with Full Debugging
      if: matrix.build-mode != 'skip'
      run: |
        echo -e "\033[1;34m🚀 Running CodeQL Analysis for ${{ matrix.language }}...\033[0m"
        gh codeql database analyze --format=sarif-latest --output=codeql-results.sarif \
        --verbosity=debug --threads=2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Display Errors with Categorized Output
      if: always()
      run: |
        echo -e "\033[1;35m📜 Displaying CodeQL results...\033[0m"
        if [[ -f "codeql-results.sarif" ]]; then
          while IFS= read -r line; do
            file=$(echo "$line" | jq -r '.file')
            line_number=$(echo "$line" | jq -r '.line')
            message=$(echo "$line" | jq -r '.message')
            error_type=$(echo "$line" | jq -r '.errorType')
            severity=$(echo "$line" | jq -r '.severity')

            if [[ "$severity" == "error" ]]; then
              echo -e "\033[1;31m🟥 FULL ERROR: $message (File: $file, Line: $line_number, Type: $error_type)\033[0m"
            elif [[ "$severity" == "warning" ]]; then
              echo -e "\033[1;33m🟨 WARNING: $message (File: $file, Line: $line_number, Type: $error_type)\033[0m"
            elif [[ "$severity" == "note" ]]; then
              echo -e "\033[1;34m🟦 GOOD PRACTICE: $message (File: $file, Line: $line_number, Type: $error_type)\033[0m"
            else
              echo -e "\033[1;37mℹ️  INFO: $message (File: $file, Line: $line_number, Type: $error_type)\033[0m"
            fi
          done < <(jq -c '.runs[].results[] | { file: .locations[0].physicalLocation.artifactLocation.uri, 
            line: .locations[0].physicalLocation.region.startLine, 
            message: .message.text, 
            errorType: .rule.id, 
            severity: .level }' codeql-results.sarif)
        else
          echo -e "\033[1;33m⚠️ No SARIF file found. No errors reported.\033[0m"
        fi

    - name: Fail Build on Critical Errors
      if: always()
      run: |
        echo -e "\033[1;31m🚨 Checking for critical errors...\033[0m"
        if [[ -f "codeql-results.sarif" ]]; then
          error_count=$(jq '[.runs[].results[] | select(.level=="error")] | length' codeql-results.sarif)
          if (( error_count > 0 )); then
            echo -e "\033[1;31m❌ $error_count critical errors found! Build failed.\033[0m"
            exit 1
          else
            echo -e "\033[1;32m✅ No critical errors detected. Build succeeded!\033[0m"
          fi
        fi
